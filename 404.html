<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — StratoSort</title>
<meta name="description" content="The page you requested could not be found on StratoSort.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#070C12">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
<link rel="canonical" href="https://stratosort.com/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070C12;--cyan:#3BA0C0;--gold:#E0A020;--t1:#DCE2E8;--t2:#8A9CAB;--t3:#6B7E91;
--sans:system-ui,-apple-system,'Segoe UI','DM Sans',sans-serif;--mono:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:48px 24px;text-align:center}
.code{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:.18em;text-transform:uppercase;margin-bottom:28px}
h1{font-size:clamp(40px,8vw,88px);font-weight:500;letter-spacing:-.04em;line-height:1;margin-bottom:24px}
h1 em{font-family:Georgia,'Times New Roman',serif;font-style:italic;color:var(--gold)}
p{font-size:16px;color:var(--t2);max-width:480px;margin:0 auto 40px;line-height:1.7}
a{display:inline-block;color:var(--bg);background:var(--gold);text-decoration:none;font-weight:500;padding:14px 28px;border-radius:8px;font-size:14px;letter-spacing:.02em;transition:transform .25s,background .25s}
a:hover{background:#F0B838;transform:translateY(-2px)}
a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="code">404 · Not found</div>
  <h1>This page <em>wandered off.</em></h1>
  <p>The address you tried doesn&rsquo;t exist on stratosort.com. It may have moved, or you may have followed a stale link.</p>
  <a href="/">Return home</a>
</main>
</body>
</html>
