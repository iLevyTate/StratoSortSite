# Deploys stratosort.com: the static landing pages in this repo at /, plus the
# StratoSort Stack documentation rendered at /docs. The docs stay authored as
# Markdown in iLevyTate/StratoSortStack docs/; scripts/build-docs.mjs turns
# them into plain HTML in this site's design (no Jekyll).
#
# Requires Settings -> Pages -> Source = "GitHub Actions". The custom domain
# (stratosort.com) is kept by the Pages settings, not the CNAME file.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Picks up docs merged in StratoSortStack without a site push.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout StratoSort Stack docs
        uses: actions/checkout@v4
        with:
          repository: iLevyTate/StratoSortStack
          ref: main
          path: stack
          sparse-checkout: docs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install build dependencies
        working-directory: site
        run: npm ci

      - name: Stage landing pages
        working-directory: site
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/_site"
          # Tracked files only, minus build tooling.
          git ls-files -z | grep -zvE '^(\.github/|scripts/|package(-lock)?\.json$|\.gitignore$)' \
            | xargs -0 cp --parents -t "$GITHUB_WORKSPACE/_site"

      - name: Build docs
        run: node site/scripts/build-docs.mjs --src stack/docs --out _site/docs

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
