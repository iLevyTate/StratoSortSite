# Deploys stratosort.com: the static landing pages in this repo at /, plus the
# StratoSort Stack documentation (iLevyTate/StratoSortStack docs/, a Jekyll
# site) built at /docs. The docs stay authored in the app repo; this workflow
# only builds and publishes them.
#
# Requires Settings -> Pages -> Source = "GitHub Actions". The custom domain
# (stratosort.com) is kept by the Pages settings, not the CNAME file.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Picks up docs merged in StratoSortStack without a site push.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout StratoSort Stack docs
        uses: actions/checkout@v4
        with:
          repository: iLevyTate/StratoSortStack
          ref: main
          path: stack
          sparse-checkout: docs

      - name: Point the docs at stratosort.com/docs
        # The committed config targets the repo's own github.io Pages site.
        run: |
          set -euo pipefail
          cfg=stack/docs/_config.yml
          sed -i -E "s|^url:.*|url: 'https://stratosort.com'|; s|^baseurl:.*|baseurl: '/docs'|" "$cfg"
          grep -qx "url: 'https://stratosort.com'" "$cfg"
          grep -qx "baseurl: '/docs'" "$cfg"

      - name: Stage landing pages
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' site/ _site/

      - name: Build docs
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./stack/docs
          destination: ./_site/docs

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
